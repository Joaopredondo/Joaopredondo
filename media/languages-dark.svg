<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="840" height="90" role="img" aria-label="Linguagem principal por repositório público: TypeScript 11, Java 10, CSS 2, Python 1">
  <defs><clipPath id="pill"><rect x="0" y="34" width="840" height="12" rx="6"/></clipPath></defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .fill { transform-origin: 0 0; animation: grow 1s cubic-bezier(.23, 1, .32, 1) backwards; }
    .leg { animation: fade .5s cubic-bezier(.23, 1, .32, 1) backwards; }
    @keyframes grow { from { transform: scaleX(.04); } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { .fill, .leg { animation: none; } }
  </style>
  <text x="0" y="14" fill="#9198a1" font-size="11.5" font-weight="600" letter-spacing="1.2">LINGUAGEM PRINCIPAL · POR REPOSITÓRIO PÚBLICO</text>
  <g clip-path="url(#pill)"><g class="fill"><rect x="0.0" y="34" width="383.0" height="12" fill="#ff8a65"/><rect x="385.0" y="34" width="348.0" height="12" fill="#f0f6fc"/><rect x="735.0" y="34" width="68.0" height="12" fill="#b1bac4"/><rect x="805.0" y="34" width="33.0" height="12" fill="#7d8590"/></g></g>
  <g class="leg" style="animation-delay:500ms"><rect x="0" y="67" width="10" height="10" rx="2" fill="#ff8a65"/><text x="17" y="76.5" fill="#f0f6fc" font-size="13.5">TypeScript <tspan fill="#9198a1">11</tspan></text></g><g class="leg" style="animation-delay:570ms"><rect x="133" y="67" width="10" height="10" rx="2" fill="#f0f6fc"/><text x="150" y="76.5" fill="#f0f6fc" font-size="13.5">Java <tspan fill="#9198a1">10</tspan></text></g><g class="leg" style="animation-delay:640ms"><rect x="220" y="67" width="10" height="10" rx="2" fill="#b1bac4"/><text x="237" y="76.5" fill="#f0f6fc" font-size="13.5">CSS <tspan fill="#9198a1">2</tspan></text></g><g class="leg" style="animation-delay:710ms"><rect x="292" y="67" width="10" height="10" rx="2" fill="#7d8590"/><text x="309" y="76.5" fill="#f0f6fc" font-size="13.5">Python <tspan fill="#9198a1">1</tspan></text></g>
</svg>
