<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="João Pedro Redondo — Desenvolvedor Java · Back-End e Full Stack">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16233a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .in { animation: rise .7s ease-out backwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .75s; } .d4 { animation-delay: 1s; }
    .t1 { animation-delay: 1.3s; } .t2 { animation-delay: 1.9s; }
    .t3 { animation-delay: 2.6s; } .t4 { animation-delay: 3.2s; } .t5 { animation-delay: 3.9s; }
    .bar { transform-origin: 64px 0; animation: grow .8s cubic-bezier(.2,.8,.2,1) .55s backwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .glow { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { from { transform: translate(-80px, 30px); } to { transform: translate(260px, -40px); } }
    @media (prefers-reduced-motion: reduce) {
      .in, .bar, .caret, .glow { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0b1220"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="glow" cx="520" cy="150" r="300" fill="url(#glow)"/>

    <text class="sans in d1" x="64" y="84" fill="#4fd1c5" font-size="14" font-weight="600" letter-spacing="3">OLÁ, EU SOU</text>
    <text class="sans in d2" x="64" y="140" fill="#f3f6fb" font-size="50" font-weight="700">João Pedro Redondo</text>
    <rect class="bar" x="64" y="160" width="88" height="5" rx="2.5" fill="#4fd1c5"/>
    <text class="sans in d3" x="64" y="204" fill="#4fd1c5" font-size="24" font-weight="600">Desenvolvedor Java · Back-End e Full Stack</text>
    <text class="sans in d4" x="64" y="238" fill="#9fb0c8" font-size="16">Spring Boot · APIs REST · Microsserviços · Angular · React · TypeScript</text>

    <g class="in d4">
      <rect x="760" y="56" width="376" height="188" rx="12" fill="#0f1a2e" stroke="#1f3350"/>
      <circle cx="784" cy="78" r="5" fill="#ff5f57"/><circle cx="802" cy="78" r="5" fill="#febc2e"/><circle cx="820" cy="78" r="5" fill="#28c840"/>
      <line x1="760" y1="98" x2="1136" y2="98" stroke="#1f3350"/>
    </g>
    <text class="mono in t1" x="782" y="128" fill="#f3f6fb"><tspan fill="#4fd1c5">$</tspan> whoami</text>
    <text class="mono in t2" x="782" y="152" fill="#9fb0c8">desenvolvedor java, full stack</text>
    <text class="mono in t3" x="782" y="182" fill="#f3f6fb"><tspan fill="#4fd1c5">$</tspan> cat experiencia.txt</text>
    <text class="mono in t4" x="782" y="206" fill="#9fb0c8">4+ anos · ERP com 1.500+ clientes</text>
    <g class="in t5"><text class="mono" x="782" y="232" fill="#4fd1c5">$</text><rect class="caret" x="798" y="219" width="9" height="16" fill="#4fd1c5"/></g>
  </g>
</svg>
